<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jubilee – Birthdays &amp; Anniversaries</title>
  <meta name="description" content="Jubilee shows your birthdays, anniversaries and countdowns as photo cards, with Home Screen widgets and reminders.">
  <meta name="apple-itunes-app" content="app-id=1012830701">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root { color-scheme: light dark; --bg: #f1f1f1; --text: #313131; --muted: #6e6e73; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --text: #fff; --muted: #a1a1a6; } }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
           background: var(--bg); color: var(--text); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
           text-align: center; padding: 48px 16px; box-sizing: border-box; }
    .icon { width: min(700px, 80vw); aspect-ratio: 1; border-radius: 22.37%; box-shadow: 0 12px 40px rgba(0,0,0,.18); }
    h1 { font-size: 2.2em; margin: 40px 0 0; }
    .tagline { margin: 4px 0 32px; color: var(--muted); }
    .badge img { height: 54px; }
    footer { margin-top: 48px; color: var(--muted); font-size: 15px; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <img class="icon" src="icon.png" alt="Jubilee app icon">
  <h1>Jubilee</h1>
  <p class="tagline">Birthdays &amp; Anniversaries</p>
  <a class="badge" href="https://apps.apple.com/app/id1012830701">
    <picture>
      <source srcset="app-store-badge-white.svg" media="(prefers-color-scheme: dark)">
      <img src="app-store-badge-black.svg" alt="Download on the App Store">
    </picture>
  </a>
  <footer>
    Support: <a href="mailto:jubilee@bziswiler.ch">jubilee@bziswiler.ch</a> · <a href="privacy/">Privacy Policy</a>
  </footer>
</body>
</html>
